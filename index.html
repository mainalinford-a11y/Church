<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACK GITUNDU PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <div class="card login-card">
            <h1>ACK GITUNDU PORTAL</h1>
            <input type="password" id="pass" placeholder="Enter Access Code">
            <button onclick="checkLogin()">Login</button>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <header>
            <div class="header-nav">
                <h2>ACK GITUNDU</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('summary')">Summary</button>
                    <button class="tab-btn" onclick="switchTab('members')">Members</button>
                    <button class="tab-btn" onclick="switchTab('giving')">Giving History</button>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="main-content">
            <div id="tab-summary" class="tab-content active">
                <div class="grid">
                    <div class="card finance-card income">
                        <h3>Last Week Income</h3>
                        <h2 id="total-income">KES 0.00</h2>
                    </div>
                    <div class="card finance-card expense">
                        <h3>Last Week Expenses</h3>
                        <h2 id="total-expense">KES 0.00</h2>
                    </div>
                </div>
                <div class="card wide">
                    <h3>🏆 Annual Cell Rankings</h3>
                    <div id="leaderboard-data"></div>
                </div>
            </div>

            <div id="tab-members" class="tab-content">
                <div class="card wide">
                    <div class="table-header">
                        <h3>👥 Church Register</h3>
                        <input type="text" id="memberSearch" placeholder="Search name..." onkeyup="searchTable('members-table', 0)">
                    </div>
                    <div class="table-container">
                        <table id="members-table">
                            <thead><tr><th>Name</th><th>ID</th><th>Cell</th><th>Role</th><th>Contact</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="tab-giving" class="tab-content">
                <div class="card wide">
                    <h3>💰 Recent Giving History</h3>
                    <div class="table-container">
                        <table id="giving-table">
                            <thead><tr><th>Date</th><th>Name</th><th>Cell</th><th>Tithe</th><th>Pledge</th><th>Total</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card wide center">
                <button class="primary-big" onclick="window.open('https://docs.google.com/spreadsheets/d/1NOl0KMh6HA5cteNHYcXEtCq9voN4-kRFjVi-kiowkZs/edit')">✏️ OPEN SPREADSHEET TO UPDATE</button>
                <p class="sync-text">System Synced: <span id="sync-time">...</span></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
