<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Finance Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="login-container">
        <div class="card login-card">
            <h2>Church Finance Login</h2>
            <p>Please enter your access code</p>
            <input type="password" id="pass" placeholder="Access Code">
            <button onclick="checkLogin()">Enter Portal</button>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <header>
            <div class="header-content">
                <h1>Church Finance Portal</h1>
                <div id="user-status"></div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="main-content">
            <div class="grid edit-only">
                <div class="card">
                    <h3>➕ Add New Member</h3>
                    <input type="text" id="mName" placeholder="Full Name">
                    <select id="mCell">
                        <option>Samaria</option>
                        <option>Jerusalem</option>
                        <option>Bethlehem</option>
                        <option>Emmaus</option>
                        <option>Nazareth</option>
                        <option>Galilee</option>
                    </select>
                    <button onclick="apiCall('addMember')">Save to Members Sheet</button>
                </div>

                <div class="card">
                    <h3>📈 New Income/Expense Stream</h3>
                    <p>Adds a new row to the Weekly Finance ledger.</p>
                    <input type="text" id="streamName" placeholder="e.g., Special Project Fund">
                    <button onclick="apiCall('addStream')">Add Row to Finance</button>
                </div>
            </div>

            <div class="card edit-only wide">
                <h3>💰 Quick Sunday Giving Entry</h3>
                <div class="input-row">
                    <input type="date" id="gDate">
                    <input type="text" id="gName" placeholder="Member Name">
                    <input type="number" id="gTithe" placeholder="Tithe">
                    <input type="number" id="gPledge" placeholder="Pledge">
                </div>
                <button onclick="apiCall('submitGiving')">Update Ledger</button>
            </div>

            <div class="card wide">
                <h3>📊 Financial Reports & Leaderboards</h3>
                <p>Access the live spreadsheets and cell analytics below.</p>
                <div class="button-group">
                    <button class="secondary"
                        onclick="window.open('https://docs.google.com/spreadsheets/d/1NOl0KMh6HA5cteNHYcXEtCq9voN4-kRFjVi-kiowkZs/edit?gid=1815679178#gid=1815679178')">Open
                        Full
                        Spreadsheet</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>


</html>
