<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST MARKS ACK GITUNDU - Executive Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="login-container" id="login-container">
        <div class="login-box">
            <h2><i class="fas fa-church"></i> ST MARKS ACK GITUNDU</h2>
            <p>Executive Dashboard Access</p>
            <input type="password" id="pass" placeholder="Enter Access Code">
            <button onclick="checkLogin()">Enter Portal</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <header>
            <div class="header-title">
                <h1>ST MARKS ACK GITUNDU</h1>
                <span id="user-tag"></span>
            </div>
            <button class="logout-btn" onclick="logout()" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">
                <i class="fas fa-chart-line"></i> Overview
            </button>
            <button class="tab-btn" onclick="switchTab('members')">
                <i class="fas fa-users"></i> Members Register
            </button>
            <button class="tab-btn" onclick="switchTab('analytics')">
                <i class="fas fa-chart-bar"></i> Monthly Progress
            </button>
        </nav>

        <div id="tab-overview" class="tab-content active">
            <div class="last-sync">
                <i class="fas fa-sync"></i> Last Updated: <span id="sync-time">Syncing...</span>
            </div>

            <div class="summary-cards">
                <div class="card">
                    <div class="card-icon income-icon"><i class="fas fa-hand-holding-usd"></i></div>
                    <h3>Total Income</h3>
                    <div class="number" id="total-income">...</div>
                    <div class="trend">Latest Sunday Collection</div>
                </div>
                <div class="card">
                    <div class="card-icon expense-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <h3>Total Expenditure</h3>
                    <div class="number" id="total-expense">...</div>
                    <div class="trend">Weekly Expenses</div>
                </div>
                <div class="card balance-card">
                    <div class="card-icon balance-icon"><i class="fas fa-wallet"></i></div>
                    <h3>Net Balance</h3>
