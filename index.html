<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST MARKS ACK GITUNDU - Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="login-container" id="login-container">
        <div class="login-box">
            <h2><i class="fas fa-church"></i> ST MARKS ACK GITUNDU</h2>
            <p>Executive Dashboard Access</p>
            <input type="password" id="pass" placeholder="Enter Access Code">
            <button onclick="checkLogin()">Enter Portal</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <header>
            <div class="header-title">
                <h1>ST MARKS ACK GITUNDU</h1>
                <span id="user-tag"></span>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab('spreadsheet')">Live Spreadsheet</button>
            <button class="tab-btn" onclick="switchTab('analytics')">Monthly Progress</button>
            <button class="tab-btn" onclick="switchTab('members')">Members</button>
        </nav>

        <div id="tab-overview" class="tab-content active">
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Income</h3>
                    <div class="number" id="total-income">...</div>
                </div>
                <div class="card">
                    <h3>Total Expenditure</h3>
                    <div class="number" id="total-expense">...</div>
                </div>
                <div class="card balance-card">
                    <h3>Net Balance</h3>
                    <div class="number" id="total-balance">...</div>
                </div>
            </div>

            <div class="grid-container">
                <div class="panel">
                    <h3>Weekly Breakdown</h3>
                    <div class="breakdown-lists">
                        <div class="list-col">
                            <h4 style="color:#2980b9">Income</h4>
                            <ul id="income-details" class="detail-list"></ul>
                        </div>
                        <div class="list-col" style="border-left: 1px solid #eee; padding-left: 15px;">
                            <h4 style="color:#c0392b">Expenditure</h4>
                            <ul id="expense-details" class="detail-list"></ul>
                        </div>
                    </div>
                </div>
                <div class="panel">
                    <h3>Cell Leaderboard</h3>
                    <div id="leaderboard-data"></div>
                </div>
            </div>
        </div>

        <div id="tab-spreadsheet" class="tab-content">
            <div class="panel" style="height: 80vh; padding: 0; overflow: hidden;">
                <div id="spreadsheet-container" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <div id="tab-analytics" class="tab-content">
            <div class="panel">
                <h3>Annual Financial Progress</h3>
                <div id="growth-chart-data"></div>
            </div>
        </div>

        <div id="tab-members" class="tab-content">
            <div class="search-bar">
                <input type="text" id="memberSearch" onkeyup="searchTable()" placeholder="Search members...">
            </div>
            <table class="data-table" id="members-table">
                <thead><tr><th>Name</th><th>No.</th><th>Cell</th><th>Type</th><th>Notes</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
