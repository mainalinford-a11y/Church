<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACK Gitundu Portal</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light-bg: #f4f7f6;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--light-bg); }
        
        /* Header & Tabs */
        .dashboard-header { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: white; border-bottom: 2px solid #ddd; padding: 0 20px; overflow-x: auto; }
        .tab-btn { 
            padding: 15px 25px; cursor: pointer; border: none; background: none; 
            font-weight: 600; color: #7f8c8d; border-bottom: 4px solid transparent; transition: 0.3s;
            white-space: nowrap;
        }
        .tab-btn.active { 
            color: var(--accent); border-bottom: 4px solid var(--accent); background: #f0f8ff; 
        }

        .container { padding: 25px; max-width: 1400px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* Weekly Navigation */
        .weekly-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px; }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
        .weekly-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        ul { list-style: none; padding: 0; }
        li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .total-row { border-top: 2px solid #eee; margin-top: 10px; font-weight: bold; padding-top: 10px; }

        /* Statement Button Styling */
        .statement-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .statement-btn:hover {
            background-color: #2980b9;
        }

        /* Spreadsheet Container */
        #tab-records { padding: 0; }
        .full-iframe-wrapper { width: 100%; height: calc(100vh - 120px); }
        iframe { width: 100%; height: 100%; border: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--primary); }

        .tab-content { display: none; }
        .active-content { display: block !important; }
        #login-container { max-width: 400px; margin: 100px auto; text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        @media (max-width: 600px) {
            .weekly-grid { grid-template-columns: 1fr; }
            .dashboard-header h2 { font-size: 1.2rem; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-container">
        <h2>Church Portal</h2>
        <input type="password" id="pass" placeholder="Enter Access Code">
        <button onclick="checkLogin()" class="nav-btn" style="width: 100%;">Login</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="dashboard-header">
            <h2 style="margin:0;">ST. MARKS ACK GITUNDU</h2>
            <button onclick="logout()" style="background:transparent; color:white; border:1px solid white; padding:5px 15px; cursor:pointer; border-radius:4px;">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview', this)">OVERVIEW</button>
            <button class="tab-btn" onclick="switchTab('members', this)">MEMBERS</button>
            <button class="tab-btn" onclick="switchTab('monthly', this)">MONTHLY GROWTH</button>
            <button class="tab-btn" onclick="switchTab('records', this)">LIVE SPREADSHEET</button>
        </div>

        <div id="tab-overview" class="tab-content active-content">
            <div class="container">
                <div class="stats-grid">
                    <div class="card">
                        <small style="color:#7f8c8d">ANNUAL INCOME</small>
                        <div id="total-income" style="font-size:1.8rem; font-weight:bold; margin-top:5px;">KES 0</div>
                    </div>
                    <div class="card">
                        <small style="color:#7f8c8d">ANNUAL EXPENDITURE</small>
                        <div id="total-expense" style="font-size:1.8rem; font-weight:bold; margin-top:5px; color:var(--danger)">KES 0</div>
                    </div>
                    <div class="card">
                        <small style="color:#7f8c8d">NET BALANCE</small>
                        <div id="total-balance" style="font-size:1.8rem; font-weight:bold; margin-top:5px;">KES 0</div>
                    </div>
                </div>

                <div class="weekly-nav">
                    <button onclick="changeWeek(-1)" class="nav-btn">← Earlier</button>
                    <div style="text-align:center">
                        <small style="display:block; color:#7f8c8d">WEEK ENDING</small>
                        <span id="week-label" style="font-weight:bold; font-size:1.1rem;">Loading...</span>
                    </div>
                    <button onclick="changeWeek(1)" class="nav-btn">Later →</button>
                </div>

                <div class="weekly-grid">
                    <div class="card">
                        <h4 style="color:var(--success); border-bottom:2px solid var(--success); padding-bottom:5px;">Weekly Income</h4>
                        <ul id="income-details"></ul>
                    </div>
                    <div class="card">
                        <h4 style="color:var(--danger); border-bottom:2px solid var(--danger); padding-bottom:5px;">Weekly Expenditure</h4>
                        <ul id="expense-details"></ul>
                    </div>
                </div>

                <div class="card" style="margin-top:25px;">
                    <h4 style="margin-top:0;">Cell Group Performance (Analytics)</h4>
                    <div id="cell-analytics-data"></div>
                </div>
            </div>
        </div>

        <div id="tab-members" class="tab-content">
            <div class="container">
                <div class="card">
                    <h3>Full Member Directory</h3>
                    <input type="text" id="memberSearch" onkeyup="searchTable()" placeholder="Search by name or cell group...">
                    <div style="overflow-x: auto;">
                        <table id="members-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Cell</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-monthly" class="tab-content">
            <div class="container">
                <div class="card">
                    <h3>Monthly Financial Progress</h3>
                    <div id="monthly-table-data" style="overflow-x: auto;"></div>
                </div>
            </div>
        </div>

        <div id="tab-records" class="tab-content">
            <div class="full-iframe-wrapper" id="spreadsheet-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
